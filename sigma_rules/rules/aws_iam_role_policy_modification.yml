title: Detects attaching or detaching of role policy
id: 6ecb7650-2f98-45a7-b24c-9ca3d6842d74
status: experimental
author: Dakky
date: 2026-11-11
description: Someone gives an existing role excessive permissions.

logsource:
  product: aws
  service: cloudtrail

detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName:
            - AttachRolePolicy
            - DetachRolePolicy
            - PutRolePolicy
    condition: selection

level: medium

tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.003

falsepositives:
  - Legitimate administrative changes, CI/CD deployments, or Infrastructure-as-Code (Terraform/CloudFormation) updates.