<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 890" width="1240" height="890" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="aPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7eb6"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="aLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker>
  </defs>

  <rect width="1240" height="890" fill="#0d1117"/>
  <text x="620" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">Detection Lab — AWS Kubernetes Architecture</text>
  <text x="620" y="60" text-anchor="middle" font-size="13" fill="#8b949e">Self-managed Kubernetes on EC2, exposed through a Network Load Balancer</text>

  <!-- Containers -->
  <rect x="230" y="84" width="990" height="770" rx="10" fill="#10151c" stroke="#6e7681" stroke-width="2"/>
  <text x="246" y="108" font-size="13" font-weight="700" fill="#e6edf3">AWS Cloud · ap-southeast-2 (Sydney)</text>

  <rect x="256" y="150" width="940" height="680" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="272" y="182" font-size="13" font-weight="700" fill="#56d364">VPC · 192.168.0.0/16</text>

  <rect x="276" y="196" width="444" height="610" rx="6" fill="none" stroke="#6e7681" stroke-dasharray="6 4"/>
  <rect x="740" y="196" width="436" height="610" rx="6" fill="none" stroke="#6e7681" stroke-dasharray="6 4"/>
  <text x="292" y="214" font-size="12" fill="#8b949e">Availability Zone 1</text>
  <text x="756" y="214" font-size="12" fill="#8b949e">Availability Zone 2</text>

  <rect x="296" y="230" width="404" height="170" rx="6" fill="#12261a" stroke="#2ea043"/>
  <text x="312" y="252" font-size="12" font-weight="700" fill="#56d364">Public subnet 1 · 192.168.1.0/24</text>
  <rect x="760" y="230" width="396" height="170" rx="6" fill="#12261a" stroke="#2ea043"/>
  <text x="776" y="252" font-size="12" font-weight="700" fill="#56d364">Public subnet 2 · 192.168.2.0/24</text>
  <text x="958" y="364" text-anchor="middle" font-size="11" font-style="italic" fill="#8b949e">NLB node only, no instances</text>

  <rect x="296" y="440" width="404" height="350" rx="6" fill="#101c33" stroke="#4c7ad6"/>
  <text x="312" y="462" font-size="12" font-weight="700" fill="#79a6ff">Private subnet · 192.168.3.0/24</text>

  <!-- External actors -->
  <rect x="30" y="110" width="160" height="60" rx="8" fill="#161b22" stroke="#6e7681"/>
  <text x="110" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Users (Internet)</text>

  <rect x="30" y="230" width="160" height="60" rx="8" fill="#161b22" stroke="#6e7681"/>
  <text x="110" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Cloudflare DNS</text>
  <text x="110" y="274" text-anchor="middle" font-size="10.5" fill="#8b949e">CNAME → NLB DNS name</text>

  <rect x="30" y="640" width="160" height="70" rx="8" fill="#161b22" stroke="#6e7681"/>
  <text x="110" y="665" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Admin workstation</text>
  <text x="110" y="683" text-anchor="middle" font-size="10.5" fill="#8b949e">cli-user · AWS CLI</text>
  <text x="110" y="699" text-anchor="middle" font-size="10.5" fill="#8b949e">ssh via ProxyCommand</text>

  <!-- AWS network components -->
  <rect x="670" y="132" width="120" height="36" rx="6" fill="#251a45" stroke="#a371f7" stroke-width="2"/>
  <text x="730" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#d2b8ff">Internet Gateway</text>

  <rect x="320" y="275" width="816" height="46" rx="8" fill="#251a45" stroke="#a371f7" stroke-width="2"/>
  <text x="728" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#d2b8ff">Network Load Balancer</text>
  <text x="728" y="311" text-anchor="middle" font-size="11.5" fill="#d2b8ff">internet-facing · cross-zone load balancing · listeners TCP 80 / 443</text>

  <rect x="320" y="335" width="180" height="50" rx="6" fill="#251a45" stroke="#a371f7" stroke-width="2"/>
  <text x="410" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#d2b8ff">NAT Gateway</text>
  <text x="410" y="373" text-anchor="middle" font-size="11" fill="#d2b8ff">zonal · Elastic IP</text>

  <rect x="320" y="650" width="360" height="50" rx="6" fill="#251a45" stroke="#a371f7" stroke-width="2"/>
  <text x="500" y="672" text-anchor="middle" font-size="13" font-weight="700" fill="#d2b8ff">EC2 Instance Connect Endpoint</text>
  <text x="500" y="689" text-anchor="middle" font-size="11" fill="#d2b8ff">SSH tunnel to private instances (port 22)</text>

  <!-- EC2 instances -->
  <rect x="320" y="490" width="150" height="100" rx="6" fill="#3a2410" stroke="#f0883e" stroke-width="2"/>
  <text x="395" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#ffb77c">Control Plane</text>
  <text x="395" y="540" text-anchor="middle" font-size="11" fill="#ffb77c">EC2 · c7i-flex.large</text>
  <text x="395" y="557" text-anchor="middle" font-size="11" fill="#ffb77c">No public IP</text>
  <text x="395" y="574" text-anchor="middle" font-size="11" fill="#ffb77c">Source/dest check off</text>

  <rect x="530" y="490" width="150" height="100" rx="6" fill="#3a2410" stroke="#f0883e" stroke-width="2"/>
  <text x="605" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#ffb77c">Worker Node</text>
  <text x="605" y="540" text-anchor="middle" font-size="11" fill="#ffb77c">EC2 · c7i-flex.large</text>
  <text x="605" y="557" text-anchor="middle" font-size="11" fill="#ffb77c">No public IP</text>
  <text x="605" y="574" text-anchor="middle" font-size="11" fill="#ffb77c">Source/dest check off</text>

  <!-- Flows -->
  <line x1="190" y1="140" x2="668" y2="140" stroke="#58a6ff" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <text x="430" y="130" text-anchor="middle" font-size="11" fill="#58a6ff">HTTP / HTTPS</text>

  <line x1="110" y1="172" x2="110" y2="228" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text x="120" y="205" font-size="11" fill="#8b949e">DNS lookup</text>

  <line x1="730" y1="168" x2="730" y2="273" stroke="#58a6ff" stroke-width="2.2" marker-end="url(#aBlue)"/>

  <line x1="605" y1="321" x2="605" y2="488" stroke="#58a6ff" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <text x="597" y="425" text-anchor="end" font-size="11" fill="#58a6ff">NodePort 32080 / 32443</text>

  <line x1="410" y1="440" x2="410" y2="387" stroke="#3fb950" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <text x="402" y="425" text-anchor="end" font-size="11" fill="#3fb950">0.0.0.0/0 → NAT</text>

  <path d="M320,360 H266 V158 H668" fill="none" stroke="#3fb950" stroke-width="2.2" marker-end="url(#aGreen)"/>

  <line x1="472" y1="540" x2="528" y2="540" stroke="#c9d1d9" stroke-width="2" marker-start="url(#aLight)" marker-end="url(#aLight)"/>
  <text x="500" y="482" text-anchor="middle" font-size="11" fill="#c9d1d9">Calico pod network · API 6443 · kubelet 10250</text>

  <line x1="395" y1="650" x2="395" y2="592" stroke="#ff7eb6" stroke-width="2.2" marker-end="url(#aPink)"/>
  <line x1="605" y1="650" x2="605" y2="592" stroke="#ff7eb6" stroke-width="2.2" marker-end="url(#aPink)"/>
  <text x="403" y="626" font-size="11" fill="#ff7eb6">SSH :22</text>
  <text x="613" y="626" font-size="11" fill="#ff7eb6">SSH :22</text>

  <line x1="190" y1="675" x2="318" y2="675" stroke="#ff7eb6" stroke-width="2.2" marker-end="url(#aPink)"/>
  <text x="196" y="667" font-size="10" fill="#ff7eb6">open-tunnel</text>

  <!-- Legend -->
  <rect x="770" y="470" width="376" height="190" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="786" y="494" font-size="13" font-weight="700" fill="#e6edf3">Legend</text>
  <line x1="786" y1="520" x2="826" y2="520" stroke="#58a6ff" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <text x="836" y="524" font-size="12" fill="#e6edf3">Inbound user traffic</text>
  <line x1="786" y1="548" x2="826" y2="548" stroke="#3fb950" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <text x="836" y="552" font-size="12" fill="#e6edf3">Outbound internet (private subnet → NAT → IGW)</text>
  <line x1="786" y1="576" x2="826" y2="576" stroke="#ff7eb6" stroke-width="2.2" marker-end="url(#aPink)"/>
  <text x="836" y="580" font-size="12" fill="#e6edf3">Admin SSH via Instance Connect Endpoint</text>
  <line x1="786" y1="604" x2="826" y2="604" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text x="836" y="608" font-size="12" fill="#e6edf3">DNS lookup (Cloudflare)</text>
  <text x="786" y="640" font-size="11" fill="#8b949e">Instances run in AZ 1 only; the NLB spans both AZs.</text>

  <text x="620" y="876" text-anchor="middle" font-size="11" fill="#8b949e">Managed with Terraform · AWS provider ~&gt; 6.0</text>
</svg>
