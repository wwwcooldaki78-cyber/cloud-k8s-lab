apiVersion: v1
kind: Namespace
metadata:
  name: splunk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splunk
  namespace: splunk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: splunk
  template:
    metadata:
      labels:
        app: splunk
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-01
      initContainers:
        - name: fix-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 41812:41812 /data"]
          volumeMounts:
            - name: splunk-var
              mountPath: /data
            - name: splunk-etc
              mountPath: /data-etc
      containers:
        - name: splunk
          image: splunk/splunk:10.4
          env:
            - name: SPLUNK_START_ARGS
              value: "--accept-license"
            - name: SPLUNK_GENERAL_TERMS
              value: "--accept-sgt-current-at-splunk-com"
            - name: SPLUNK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: splunk-admin
                  key: password
          ports:
            - containerPort: 8000
            - containerPort: 8089
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            exec:
              command: ["/sbin/checkstate.sh"]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/sbin/checkstate.sh"]
            periodSeconds: 30
          volumeMounts:
            - name: splunk-var
              mountPath: /opt/splunk/var
            - name: splunk-etc
              mountPath: /opt/splunk/etc
      volumes:
        - name: splunk-var
          hostPath:
            path: /var/lib/splunk-var
            type: DirectoryOrCreate
        - name: splunk-etc
          hostPath:
            path: /var/lib/splunk-etc
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Secret
metadata:
  name: splunk-admin
  namespace: splunk
type: Opaque
stringData:
  password: "Myverystrongpassword!"
---
apiVersion: v1
kind: Service
metadata:
  name: splunk
  namespace: splunk
spec:
  type: NodePort
  selector:
    app: splunk
  ports:
    - name: web
      port: 8000
      targetPort: 8000
      nodePort: 30800
    - name: mgmt
      port: 8089
      targetPort: 8089
      nodePort: 30809